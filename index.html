        crossorigin=""/>

  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

<body>

<!-- ============================================ -->
<!-- FIXED TOP NAV                                -->
<!-- ============================================ -->
<nav class="top-nav" id="topNav">
  <div class="top-nav-left">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <div class="brand">
      <img src="assets/logo.png" alt="" class="brand-logo">
      <span class="brand-name">AquaQuest</span>
    </div>
  </div>
  <div class="top-nav-right">
    <i class="fas fa-bell notif-icon" id="notifIcon" role="button" aria-label="Notifications" tabindex="0"></i>
    <i class="fas fa-search search-icon" id="searchIcon" role="button" aria-label="Search" tabindex="0" style="display:none;"></i>
  </div>

  <!-- SEARCH EXPANSION -->
  <div class="nav-search-wrap" id="navSearchWrap">
    <button class="nav-search-back" id="navSearchBack" aria-label="Close search">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="nav-search-input-wrap">
      <i class="fas fa-search search-input-icon"></i>
      <input type="text" class="nav-search-input" id="navSearchInput" placeholder="Search sites, stories, people..." autocomplete="off">
      <button class="nav-search-clear" id="navSearchClear" aria-label="Clear">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
</nav>

<!-- ============================================ -->
<!-- PAGES                                        -->
<!-- ============================================ -->
<section class="page active" id="page-home"></section>
<section class="page" id="page-map"></section>
<section class="page" id="page-sites"></section>
<section class="page" id="page-site-detail"></section>
<section class="page" id="page-observe"></section>
<section class="page" id="page-feed"></section>
<section class="page" id="page-learn"></section>
<section class="page" id="page-saved"></section>
<section class="page" id="page-actions"></section>
<section class="page" id="page-challenge-detail"></section>
<section class="page" id="page-contribution-flow"></section>
<section class="page" id="page-reports"></section>
<section class="page" id="page-profile"></section>
<section class="page" id="page-user-profile"></section>


<!-- ============================================ -->
<!-- BOTTOM NAVIGATION — 5 items                  -->
<!-- ============================================ -->
<nav class="bottom-nav" id="bottomNav">
  <a href="#" class="nav-item active" data-nav="home">
    <i class="fas fa-compass"></i>
    <span>Explore</span>
  </a>
  <a href="#" class="nav-item" data-nav="map">
    <i class="fas fa-map-location-dot"></i>
    <span>Map</span>
  </a>
  <button class="nav-item nav-item-add" id="navAddBtn" aria-label="Add">
    <span class="nav-add-btn">
      <i class="fas fa-plus"></i>
    </span>
  </button>
  <a href="#" class="nav-item" data-nav="feed">
    <i class="fas fa-water"></i>
    <span>Stories</span>
  </a>
  <a href="#" class="nav-item" data-nav="profile">
    <i class="fas fa-user"></i>
    <span>Me</span>
  </a>
</nav>

<!-- ============================================ -->
<!-- ACTION SHEET (for + button)                   -->
<!-- ============================================ -->
<div class="action-sheet" id="quickActionSheet">
  <div class="action-sheet-backdrop" onclick="closeQuickActionSheet()"></div>
  <div class="action-sheet-panel">
    <div class="action-sheet-handle"></div>
    <p class="action-sheet-title">What would you like to do?</p>

    <button class="action-sheet-item" onclick="quickActionObserve()">
      <div class="action-sheet-icon" style="background: var(--pc-accent-soft); color: var(--pc-accent);">
        <i class="fas fa-eye"></i>
      </div>
      <div class="action-sheet-info">
        <p class="action-sheet-label">Record Observation</p>
        <p class="action-sheet-sub">Log what you see at a waterbody</p>
      </div>
      <i class="fas fa-chevron-right action-sheet-chevron"></i>
    </button>

    <button class="action-sheet-item" onclick="quickActionReport()">
      <div class="action-sheet-icon" style="background: var(--pc-danger-soft); color: var(--pc-danger);">
        <i class="fas fa-triangle-exclamation"></i>
      </div>
      <div class="action-sheet-info">
        <p class="action-sheet-label">Report Concern</p>
        <p class="action-sheet-sub">Pollution, litter, dead fish &amp; more</p>
      </div>
      <i class="fas fa-chevron-right action-sheet-chevron"></i>
    </button>

    <button class="action-sheet-item" onclick="quickActionStory()">
      <div class="action-sheet-icon" style="background: var(--pc-purple-soft); color: var(--pc-purple);">
        <i class="fas fa-book-open"></i>
      </div>
      <div class="action-sheet-info">
        <p class="action-sheet-label">Share a Story</p>
        <p class="action-sheet-sub">Photo, wildlife sighting or learning</p>
      </div>
      <i class="fas fa-chevron-right action-sheet-chevron"></i>
    </button>

    <button class="action-sheet-cancel" onclick="closeQuickActionSheet()">Cancel</button>
  </div>
</div>

<!-- ============================================ -->
<!-- SIDE DRAWER                                  -->
<!-- ============================================ -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>

<aside class="side-drawer" id="sideDrawer" aria-hidden="true">
  <div class="drawer-user">
    <div class="drawer-avatar" id="drawerAvatar">?</div>
    <div class="drawer-user-info">
      <p class="drawer-user-name" id="drawerUserName">Welcome</p>
      <p class="drawer-user-email" id="drawerUserEmail">Sign in to continue</p>
    </div>
  </div>

  <div class="drawer-signin-banner" id="drawerSigninBanner">
    <p><i class="fas fa-lock-open"></i> Sign in to track your impact</p>
    <button class="drawer-signin-btn" id="drawerSigninBtn">Sign In</button>
  </div>

  <div class="drawer-section">
    <p class="drawer-section-label">Explore</p>
    <button class="drawer-item" data-drawer-action="sites">
      <i class="fas fa-water"></i>
      <span>Explore Waters</span>
      <span class="drawer-badge" id="drawerSitesCount">0</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
    <button class="drawer-item" data-drawer-action="map">
      <i class="fas fa-map-location-dot"></i>
      <span>Community Map</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
    <button class="drawer-item" data-drawer-action="actions">
      <i class="fas fa-seedling"></i>
      <span>Community Actions</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
    <button class="drawer-item" data-drawer-action="learn">
      <i class="fas fa-graduation-cap"></i>
      <span>Learn</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
    <button class="drawer-item" data-drawer-action="saved">
      <i class="fas fa-bookmark"></i>
      <span>Saved Posts</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
  </div>

  <div class="drawer-section">
    <p class="drawer-section-label">My Activity</p>
    <button class="drawer-item" data-drawer-action="reports">
      <i class="fas fa-flag"></i>
      <span>My Reports</span>
      <span class="drawer-badge" id="drawerReportsCount">0</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
    <button class="drawer-item" data-drawer-action="notifications">
      <i class="fas fa-bell"></i>
      <span>Notifications</span>
      <span class="drawer-badge" id="drawerNotifCount">0</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
  </div>

  <div class="drawer-section">
    <p class="drawer-section-label">Preferences</p>
    <button class="drawer-item" data-drawer-action="settings">
      <i class="fas fa-cog"></i>
      <span>Settings</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
    <div class="drawer-item drawer-toggle-item">
      <i class="fas fa-moon"></i>
      <span>Dark Mode</span>
      <label class="drawer-switch" onclick="event.stopPropagation()">
        <input type="checkbox" id="drawerDarkMode">
        <span class="drawer-switch-slider"></span>
      </label>
    </div>
    <button class="drawer-item" data-drawer-action="export">
      <i class="fas fa-file-export"></i>
      <span>Export My Data</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
    <button class="drawer-item drawer-item-danger" data-drawer-action="clear">
      <i class="fas fa-trash-alt"></i>
      <span>Clear All Data</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
  </div>

  <div class="drawer-footer">
    <button class="drawer-item" data-drawer-action="about">
      <i class="fas fa-info-circle"></i>
      <span>About AquaQuest</span>
      <i class="fas fa-chevron-right drawer-chevron"></i>
    </button>
    <button class="drawer-auth-btn" id="drawerAuthBtn">
      <i class="fas fa-sign-in-alt" id="drawerAuthIcon"></i>
      <span id="drawerAuthText">Login / Sign Up</span>
    </button>
    <p class="drawer-version">AquaQuest v1.0 · 2026</p>
  </div>
</aside>
