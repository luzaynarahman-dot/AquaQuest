<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaQuest — Offline</title>
  <meta name="theme-color" content="#0E3A4C">

  <link rel="stylesheet" href="css/palette.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--pc-bg);
      color: var(--pc-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .offline-wrap {
      max-width: 400px;
      width: 100%;
      background: var(--pc-card);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: var(--pc-shadow-lg);
      border: 1px solid var(--pc-border-light);
    }

    .offline-icon {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pc-primary-light), var(--pc-accent-soft));
      color: var(--pc-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin: 0 auto 24px;
      border: 3px solid var(--pc-card);
      box-shadow: 0 8px 24px rgba(14, 58, 76, 0.15);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .offline-title {
      font-family: 'Caveat', cursive;
      font-size: 2rem;
      font-weight: 700;
      color: var(--pc-text);
      margin-bottom: 12px;
      line-height: 1.1;
    }

    .offline-sub {
      font-size: 14px;
      color: var(--pc-text-2);
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .offline-hint {
      padding: 14px 18px;
      background: var(--pc-paper);
      border-radius: 14px;
      font-size: 12.5px;
      color: var(--pc-text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .offline-hint i {
      color: var(--pc-warning);
      font-size: 16px;
      flex-shrink: 0;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      background: var(--pc-primary);
      color: var(--pc-text-on-dark);
      border: none;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.22s ease;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(14, 58, 76, 0.25);
      width: 100%;
    }

    .retry-btn:hover {
      background: var(--pc-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(14, 58, 76, 0.35);
    }

    .retry-btn:active { transform: translateY(0); }

    .brand-mini {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
      font-family: 'Caveat', cursive;
      font-size: 20px;
      color: var(--pc-accent);
      font-weight: 700;
    }

    .brand-mini i { font-size: 18px; }
  </style>
</head>
<body>

  <div class="offline-wrap">
    <div class="offline-icon">
      <i class="fas fa-water"></i>
    </div>

    <h1 class="offline-title">You're offline</h1>
    <p class="offline-sub">
      Looks like you lost your connection. Don't worry — your water data is safe and waiting.
    </p>

    <div class="offline-hint">
      <i class="fas fa-lightbulb"></i>
      <span>Check your Wi-Fi or mobile data, then tap Try Again.</span>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">
      <i class="fas fa-rotate-right"></i> Try Again
    </button>

    <div class="brand-mini">
      <i class="fas fa-water"></i>
      <span>AquaQuest</span>
    </div>
  </div>

  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>

</body>
</html>
